name: CI CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8 pytest

      - name: Обучение модели
        run: python model/train.py

      - name: Проверка стиля
        run: flake8 app --max-line-length=120

      - name: Запуск тестов
        run: pytest -v app/tests/

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Подготовка модели
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          python model/train.py

      - name: Вход в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка образа
        run: docker build -t $IMAGE_NAME:latest -f docker/Dockerfile .

      - name: Отправка образа в Registry
        run: docker push $IMAGE_NAME:latest

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, app-server]

    steps:
      - name: Развёртывание на ВМ2
        run: |
          cd ~/ml-prediction-service
          git pull origin main
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          printf "DB_PASSWORD=%s\n" "${{ secrets.DB_PASSWORD }}" > docker/.env
          chmod 600 docker/.env
          docker ps -aq --filter "name=ml-app" | xargs -r docker rm -f
          docker-compose -f docker/docker-compose.yml pull
          docker-compose -f docker/docker-compose.yml up -d --force-recreate
