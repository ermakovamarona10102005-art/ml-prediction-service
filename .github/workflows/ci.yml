name: CI CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установка библиотек
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8 pytest

      - name: Обучение модели
        run: python model/train.py

      - name: Проверка стиля
        run: flake8 app --max-line-length=120

      - name: Запуск тестов
        run: pytest -v app/tests/

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Подготовка модели
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          python model/train.py

      - name: Вход в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка образа
        run: docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_NAME:${{ github.sha }}" -f docker/Dockerfile .

      - name: Отправка образа в Registry
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, app-server]
    concurrency:
      group: app-server-deploy
      cancel-in-progress: false

    steps:
      - name: Развёртывание на ВМ2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd ~/ml-prediction-service
          for attempt in 1 2 3; do
            if git -c http.version=HTTP/1.1 fetch "https://github.com/${{ github.repository }}.git" main:refs/remotes/origin/main; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          git merge --ff-only origin/main
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          test -n "$DB_PASSWORD"
          umask 077
          printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" > docker/.env
          chmod 600 docker/.env
          bash scripts/deploy.sh "$IMAGE_NAME:$IMAGE_TAG"
          python3 ansible/verify_lab6.py
