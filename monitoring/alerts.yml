groups:
- name: ml-service-alerts
  rules:
  - alert: MLServiceDown
    expr: up{job="prediction-service"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: ML service unavailable for one minute
  - alert: HighPredictionLatency
    expr: histogram_quantile(0.95, sum by (le) (rate(ml_prediction_latency_seconds_bucket[5m])))
      > 1
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: Prediction p95 exceeds one second
  - alert: LowPredictionAccuracy
    expr: (sum(increase(ml_correct_predictions_total[10m])) / sum(increase(ml_labeled_predictions_total[10m]))
      < 0.8) and (sum(increase(ml_labeled_predictions_total[10m])) >= 10)
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: Accuracy on labeled requests is below 80 percent
  - alert: NoPredictionsReceived
    expr: sum(rate(ml_predictions_total[10m])) == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: No predictions received for ten minutes
  - alert: LoggerServiceDown
    expr: up{job="logger-service"} == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: LoggerServiceDown
  - alert: LoggerErrors
    expr: increase(logger_db_errors_total[5m]) > 3
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: LoggerErrors
  - alert: PredictionLoggerErrors
    expr: increase(ml_logger_errors_total[5m]) > 3
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: PredictionLoggerErrors
