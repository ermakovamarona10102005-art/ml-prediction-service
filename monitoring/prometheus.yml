global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prediction-service
    static_configs:
      - targets: [prediction-service:5000]
  - job_name: logger-service
    static_configs:
      - targets: [logger-service:5001]
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
