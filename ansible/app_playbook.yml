---
- name: Deploy prediction and logger microservices
  hosts: app
  become: true
  vars:
    project_dir: /home/student/ml-prediction-service
    ansible_become_password: "{{ lookup('env', 'LAB8_VM_PASSWORD') }}"
    pull_images: true
  tasks:
    - name: Install Docker and Compose
      apt:
        name: [docker.io, docker-compose-v2]
        state: present
    - name: Enable Docker
      service:
        name: docker
        state: started
        enabled: true
    - name: Validate stack configuration
      command: docker compose --env-file docker/.env --env-file docker/images.env -f docker/docker-compose.yml config --quiet
      args:
        chdir: "{{ project_dir }}"
      become_user: student
      changed_when: false
    - name: Pull exact microservice images
      command: docker compose --env-file docker/.env --env-file docker/images.env -f docker/docker-compose.yml pull --policy missing prediction-service logger-service
      args:
        chdir: "{{ project_dir }}"
      become_user: student
      when: pull_images | bool
      changed_when: false
    - name: Start both microservices and monitoring
      command: docker compose --env-file docker/.env --env-file docker/images.env -f docker/docker-compose.yml up -d --no-build --remove-orphans
      args:
        chdir: "{{ project_dir }}"
      become_user: student
      register: compose
      changed_when: "'Started' in compose.stderr or 'Recreated' in compose.stderr or 'Created' in compose.stderr"
    - name: Verify both health endpoints
      uri:
        url: "http://127.0.0.1:{{ item }}/health"
        status_code: 200
      loop: [5000, 5001]
      register: health
      until: health.status == 200
      retries: 30
      delay: 3
