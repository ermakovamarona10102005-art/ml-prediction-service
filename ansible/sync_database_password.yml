---
- name: Explicitly synchronize the application database password
  hosts: db
  become: true
  vars:
    db_password: "{{ lookup('env', 'LAB6_DB_PASSWORD') }}"
  tasks:
    - name: Require the desired password
      assert:
        that: db_password | length > 0
      no_log: true
    - name: Set the application role password without changing data
      become_user: postgres
      community.postgresql.postgresql_user:
        name: ml_app
        password: "{{ db_password }}"
        no_password_changes: false
        state: present
      no_log: true
      register: password_sync
      ignore_errors: true
    - name: Report a sanitized synchronization error
      fail:
        msg: "{{ password_sync.msg | default('Password synchronization failed') | replace(db_password, '[redacted]') }}"
      when: password_sync is failed
