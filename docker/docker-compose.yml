version: "3.8"

services:
  app:
    image: ghcr.io/ermakovamarona10102005-art/ml-prediction-service:latest
    container_name: ml-app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: 10.10.10.11
      DB_NAME: ml_predictions
      DB_USER: ml_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE: require
      MODEL_PATH: /model/model.pkl
    restart: unless-stopped
